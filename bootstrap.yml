---
- name: Bootstrap the administrator account
  hosts: all
  gather_facts: false
  vars_files:
    - vars/main.yml
  vars_prompt:
    - name: admin_password
      prompt: Password for the administrator account
      private: true
      confirm: true

  pre_tasks:
    - name: Upgrade the system and install bootstrap dependencies
      ansible.builtin.raw: pacman -Syu --needed --noconfirm python sudo
      changed_when: true

    - name: Gather facts after installing Python
      ansible.builtin.setup:

    - name: Validate account names and bootstrap connection
      ansible.builtin.assert:
        that:
          - ansible_facts["user_id"] == "root"
          - admin_user != "root"
          - dev_user != "root"
          - admin_user != dev_user
        fail_msg: >-
          Connect as root; administrator and development users must be
          distinct non-root accounts.

  tasks:
    - name: Ensure administrator group exists
      ansible.builtin.group:
        name: "{{ admin_user }}"
        state: present

    - name: Ensure wheel group exists
      ansible.builtin.group:
        name: wheel
        state: present

    - name: Create administrator account
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: "{{ admin_user }}"
        groups:
          - wheel
        append: true
        create_home: true
        shell: /bin/bash
        state: present

    - name: Set administrator password
      ansible.builtin.command: /usr/bin/chpasswd
      args:
        stdin: "{{ admin_user }}:{{ admin_password }}"
      changed_when: true
      no_log: true

    - name: Authorize administrator SSH key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ personal_authorized_key }}"

    - name: Grant administrator sudo access
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL:ALL) ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/bin/visudo -cf %s
