- name: Install tailscale
  become: true
  community.general.pacman:
    name:
      - tailscale
  tags:
    - install
    - tailscale

- name: Enable and start tailscaled
  become: true
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  tags:
    - install
    - tailscale
