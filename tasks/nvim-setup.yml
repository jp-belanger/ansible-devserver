- name: Install neovim
  become: true
  community.general.pacman:
    name: neovim
  tags:
    - install
    - neovim

- name: Create required nvim directory
  ansible.builtin.file:
    path: "{{ dev_home }}/.local/share/nvim/site/autoload"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ dev_user }}"
  tags:
    - install
    - neovim
